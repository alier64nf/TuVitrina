services:
  postgres:
    image: postgres:16-alpine
    container_name: tuvitrina-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tuvitrina
    volumes:
      - tuvitrina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tuvitrina']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tuvitrina-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - tuvitrina_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuvitrina_pgdata:
  tuvitrina_redis:
